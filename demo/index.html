  <body>
    <main id="demo">
      <noscript>
        <h1>Langton</h1>
        <p>
          An FFGL source that runs Langton's ant, and an effect in which the
          ants walk your clip. An ant on a grid of black and white cells turns
          right on white and left on black, flips the cell and steps on. That's
          the whole rule, and nothing in the plugin draws a picture of an ant's
          walk. For about ten thousand steps it makes a mess nobody has found
          any order in, then it starts building a highway and never stops. Turk
          and Propp's many-coloured ants are a dropdown away, up to eight ants
          take turns, and the walk runs backwards exactly, so the chaos can
          un-happen into the empty grid it came from.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its walk in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/langton">its repository</a>.
        </p>
